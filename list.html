<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' memo-img: data:; style-src 'self'; script-src 'self'">
  <title>Keepho</title>
  <link rel="stylesheet" href="list.css">
</head>
<body>
  <header>
    <div class="top">
      <h1>메모</h1>
      <div class="actions">
        <button id="capture" class="ghost with-icon"><span data-icon="scan"></span>화면 캡처</button>
        <button id="new" class="with-icon" title="새 메모 (Ctrl+N)"><span data-icon="plus"></span>새 메모</button>
      </div>
    </div>
    <label class="search-box">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="메모 검색" autocomplete="off">
    </label>

    <!-- 메모 / 휴지통 전환 -->
    <nav id="tabs">
      <button data-tab="notes" class="on">메모</button>
      <button data-tab="trash">휴지통 <span id="trashCount"></span></button>
    </nav>

    <div id="trashBar" hidden>
      <span id="trashInfo"></span>
      <button id="emptyTrash" class="ghost">휴지통 비우기</button>
    </div>
  </header>

  <!-- 메모 카드들이 여기에 그려져요 -->
  <main id="cards"></main>

  <script src="icons.js"></script>
  <script src="list.js"></script>
</body>
</html>
